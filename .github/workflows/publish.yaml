# Publishes a tagged version to the TYPO3 Extension Repository (TER) with TYPO3's own tool tailor.
# Packagist picks up the tag by itself.
#
# Safeguards: actions are pinned to commit SHAs (Dependabot keeps them current), and only a tag X.Y.Z
# whose version is in composer.json and ext_emconf.php and whose commit lies on the branch of its
# release line is published. Release lines: 10.x on v10, 12.x on v12, 14.x on main.
name: Publish to TER

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to TER
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag, version and release branch
        id: check
        run: |
          version="${GITHUB_REF_NAME}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $version is not a version X.Y.Z"
            exit 1
          fi
          grep -q "\"version\": \"$version\"" composer.json || { echo "::error::composer.json does not declare $version"; exit 1; }
          grep -q "'version' => '$version'" ext_emconf.php || { echo "::error::ext_emconf.php does not declare $version"; exit 1; }
          case "${version%%.*}" in
            10) branch=v10 ;;
            12) branch=v12 ;;
            14) branch=main ;;
            *) echo "::error::No release branch for major version ${version%%.*}"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::Tag $version is not on branch $branch"
            exit 1
          fi
          comment="$(git tag -l "$version" --format='%(contents:subject)')"
          if [ -z "${comment// }" ]; then
            comment="Released version $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "comment=$comment" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor:2.0.0 --prefer-dist --no-progress

      - name: Publish to TER
        env:
          COMMENT: ${{ steps.check.outputs.comment }}
          VERSION: ${{ steps.check.outputs.version }}
        run: php "$(composer global config bin-dir --absolute)/tailor" ter:publish --comment "$COMMENT" "$VERSION"
