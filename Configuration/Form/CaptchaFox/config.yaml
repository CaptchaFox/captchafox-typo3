# Form configuration of the CaptchaFox extension. TYPO3 finds this file by itself (form set,
# Configuration/Form/<set>/config.yaml); neither TypoScript nor a static template is needed.
name: captchafox/captchafox-typo3
label: 'CaptchaFox'
priority: 200

prototypes:
  standard:
    formEditor:
      translationFiles:
        4507: 'EXT:captchafox_official/Resources/Private/Language/Backend.xlf'

    validatorsDefinition:
      CaptchaFox:
        implementationClassName: CaptchaFox\CaptchaFoxTypo3\Validation\CaptchaFoxValidator
        formEditor:
          iconIdentifier: form-validator
          label: formEditor.elements.CaptchaFox.editor.validators.CaptchaFox.label

    formElementsDefinition:
      Form:
        renderingOptions:
          # Partial of the CaptchaFox element (Resources/Private/Partials/CaptchaFox.html)
          partialRootPaths:
            4507: 'EXT:captchafox_official/Resources/Private/Partials/'

      # The form editor renders the element with its generic web component; no stage template or
      # JavaScript of its own is needed.
      CaptchaFox:
        implementationClassName: CaptchaFox\CaptchaFoxTypo3\Domain\Model\FormElements\CaptchaFoxElement
        properties:
          containerClassAttribute: 'form-element form-element-captchafox mb-3 captchafox'
          labelClassAttribute: form-label
        formEditor:
          label: formEditor.elements.CaptchaFox.label
          description: formEditor.elements.CaptchaFox.description
          group: custom
          groupSorting: 700
          iconIdentifier: t3-form-icon-captchafox
          predefinedDefaults:
            renderingOptions:
              doNotShowLabel: 1
            validators:
              - identifier: CaptchaFox
          editors:
            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor
            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.label.label
              propertyPath: label
            300:
              identifier: doNotShowLabel
              templateName: Inspector-CheckboxEditor
              label: formEditor.elements.CaptchaFox.editor.doNotShowLabel.label
              propertyPath: renderingOptions.doNotShowLabel
            600:
              identifier: displayMode
              templateName: Inspector-SingleSelectEditor
              label: formEditor.elements.CaptchaFox.editor.displayMode.label
              propertyPath: renderingOptions.displayMode
              doNotSetIfPropertyValueIsEmpty: true
              selectOptions:
                10:
                  value: 'inline'
                  label: formEditor.elements.CaptchaFox.editor.displayMode.option.inline
                15:
                  value: 'popup'
                  label: formEditor.elements.CaptchaFox.editor.displayMode.option.popup
            900:
              identifier: validators
              templateName: Inspector-ValidatorsEditor
              label: formEditor.elements.TextMixin.editor.validators.label
              selectOptions:
                20:
                  value: CaptchaFox
                  label: formEditor.elements.CaptchaFox.editor.validators.CaptchaFox.label
            9999:
              identifier: removeButton
              templateName: Inspector-RemoveElementEditor
          propertyCollections:
            validators:
              20:
                identifier: CaptchaFox
                editors:
                  100:
                    identifier: header
                    templateName: Inspector-CollectionElementHeaderEditor
                    label: formEditor.elements.CaptchaFox.editor.validators.CaptchaFox.label
